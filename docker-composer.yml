services:
  api:
    build: .
    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app_password
      DB_NAME: product_db

      REDIS_URL: redis://redis:6379
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: product_db
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password

    volumes:
      - mysql_data:/var/lib/mysql
  
  redis:
    image: redis:7-alpine
  
volumes:
  mysql_data: 